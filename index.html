  <style>
    :root {
      --bg-deep: #101214;        /* Darkest ash background */
      --bg-main: #16181c;        /* Primary page background */
      --bg-card: #1f2329;        /* Card background */
      --bg-card-hover: #2e343d;  /* Card hover state */
      --border-color: #2e343d;   /* Subtle divider border */
      --accent-gray: #3a414d;    /* Active states and accents */
      --text-white: #ffffff;     /* All primary text pure white */
      --text-muted: #a0a6b1;     /* Subtitle text light ash */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-white);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .header {
      background-color: var(--bg-main);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-white);
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background-color: var(--text-white);
      color: var(--bg-deep);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .search-box {
      flex: 1;
      max-width: 450px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.5rem;
      background-color: var(--bg-deep);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-white);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--text-white);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
    }

    /* MAIN CONTENT WRAPPER - Custom Background for Categories & Game Cards Area */
    .main-wrapper {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      flex: 1;
      
      /* HIGH-RES PARALLAX BACKGROUND SETTINGS */
      background-image: url('');
      background-attachment: fixed;           /* Creates scrolling motion effect */
      background-position: center;
      background-repeat: repeat;               /* Tiles image to preserve crisp resolution */
      background-size: 400px auto;             /* Adjusts scale so image stays super sharp */
      border-radius: var(--radius-md);
    }

    .category-section {
      margin-bottom: 2rem;
    }

    .category-bar {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    .category-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
      transition: var(--transition);
    }

    .category-btn:hover {
      background-color: var(--bg-card-hover);
    }

    .category-btn.active {
      background-color: var(--text-white);
      color: var(--bg-deep);
      border-color: var(--text-white);
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.25rem;
    }

    .game-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--text-white);
      background-color: var(--bg-card-hover);
    }

    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: var(--bg-deep);
      overflow: hidden;
    }

    .thumbnail-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition);
    }

    .game-card:hover .thumbnail-img {
      transform: scale(1.05);
    }

    .card-content {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.25rem;
    }

    .game-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1.2;
    }

    .fav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.2rem;
      transition: var(--transition);
    }

    .fav-btn:hover, .fav-btn.active {
      color: #ff4757;
    }

    .game-category-tag {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-container {
      width: 90%;
      max-width: 1000px;
      height: 85vh;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .modal-header {
      padding: 1rem 1.25rem;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-white);
    }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
    }

    .action-btn {
      background-color: var(--bg-deep);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 0.4rem 0.75rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: var(--transition);
    }

    .action-btn:hover {
      background-color: var(--text-white);
      color: var(--bg-deep);
    }

    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      background-color: #000;
      position: relative;
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .footer {
      background-color: var(--bg-main);
      border-top: 1px solid var(--border-color);
      padding: 1.5rem;
      text-align: center;
      color: var(--text-white);
      font-size: 0.85rem;
      margin-top: 3rem;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
  </style>
</head>

    // Helper for generating dynamic fallback SVG images for missing local image files
    const getPlaceholderImage = (title) => {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="170" viewBox="0 0 300 170"><rect width="100%" height="100%" fill="#1f2329"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="18" fill="#ffffff">${title}</text></svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

    let favorites = JSON.parse(localStorage.getItem('vault_ubg_favs')) || [];

    const closeModalBtn = document.getElementById('closeModalBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    let currentCategory = 'all';
    let searchQuery = '';

    function renderGames() {
      gamesGrid.innerHTML = '';

      const filtered = GAMES.filter(game => {
        const matchesCategory = 
          currentCategory === 'all' ? true :
          currentCategory === 'favorites' ? favorites.includes(game.id) :
          game.category === currentCategory;

        const matchesSearch = game.title.toLowerCase().includes(searchQuery.toLowerCase());

        return matchesCategory && matchesSearch;
      });

                 src="${game.thumbnail}" 
                 alt="${game.title}"
                 onerror="this.onerror=null; this.src='${getPlaceholderImage(game.title)}';">
          </div>
          <div class="card-content">
            <div class="card-header">
              <span class="game-title">${game.title}</span>
              <button class="fav-btn ${isFav ? 'active' : ''}" data-id="${game.id}">
                <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i>
              </button>
            </div>
            <div class="game-category-tag">${game.category}</div>
          </div>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.closest('.fav-btn')) return;
          openGame(game);
        });

        const favBtn = card.querySelector('.fav-btn');
        favBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFavorite(game.id);
        });

        gamesGrid.appendChild(card);
      });
    }

    function toggleFavorite(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('vault_ubg_favs', JSON.stringify(favorites));
      renderGames();
    }

    function openGame(game) {
      modalGameTitle.textContent = game.title;
      gameIframe.src = game.fileUrl;
      gameModal.classList.add('active');
    }

    function closeGame() {
      gameModal.classList.remove('active');
      gameIframe.src = '';
    }

    closeModalBtn.addEventListener('click', closeGame);

    fullscreenBtn.addEventListener('click', () => {
      if (gameIframe.requestFullscreen) {
        gameIframe.requestFullscreen();
      } else if (gameIframe.webkitRequestFullscreen) {
        gameIframe.webkitRequestFullscreen();
      }
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderGames();
    });

    categoryBar.addEventListener('click', (e) => {
      const btn = e.target.closest('.category-btn');
      if (!btn) return;

      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      currentCategory = btn.dataset.category;
      sectionHeading.textContent = btn.textContent.trim();
      renderGames();
    });

    renderGames();
  </script>
</body>
</html>
